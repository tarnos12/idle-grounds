<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Idle Grounds — Prototype</title>
  <!-- ?v= busts any stale cached copies (the server also sends no-store now) -->
  <link rel="stylesheet" href="style.css?v=23" />
</head>
<body>
  <!-- Main: camera-locked world viewport -->
  <main id="main">
    <section id="area-panel">
      <div id="world-viewport">
        <canvas id="game-canvas"></canvas>
        <div id="arrows"></div>
      </div>
    </section>
  </main>

  <!-- Build menu (toggled by the Build button / B key) -->
  <div id="build-menu" class="hidden"></div>

  <!-- Converter recipe picker (left-click a converter building) -->
  <div id="recipe-menu" class="hidden"></div>

  <!-- Wisp lantern link editor (left-click a lantern) -->
  <div id="link-menu" class="hidden"></div>

  <!-- Meditation Pavilion disciple roster (left-click a pavilion) -->
  <div id="roster-menu" class="hidden"></div>

  <!-- Bottom bar (moved from the top) -->
  <header id="topbar">
    <div class="brand">🌍 Idle Grounds</div>
    <div class="top-right">
      <div class="area-pill">📍 <span id="area-name">Forest</span></div>
      <div class="hand-pill">✋ <span id="hand-count">0/20</span></div>
      <div class="buff-pill hidden" id="buff-pill"></div>
      <button id="help-btn" title="How to play">❓ Help</button>
      <button id="build-btn">🔨 Build</button>
      <button id="demolish-btn" title="Destroy a building (refunds its resources)">🗑 Demolish</button>
      <button id="debug-btn">🐞 Debug</button>
      <button id="reset-btn" title="Wipe the save and start over">↺ Reset</button>
    </div>
  </header>

  <!-- Hand cursor overlay (follows the mouse, shows what you carry) -->
  <div id="hand-cursor" class="hidden"></div>

  <!-- Instant tooltip for the upgrade tree -->
  <div id="utip" class="hidden"></div>

  <!-- Upgrade tree (opened by clicking the Altar) -->
  <div id="upgrades-modal" class="modal hidden">
    <div class="modal-box upgrades-box">
      <div class="modal-head">
        <h2>🏛️ Altar — Upgrades</h2>
        <button id="tree-debug-btn" title="Reveal hidden upgrades (debug)">🐞 Debug</button>
        <button id="upgrades-close" class="close-btn">✕</button>
      </div>
      <div id="upgrades-body"><canvas id="tree-canvas"></canvas></div>
    </div>
  </div>

  <!-- Tutorial quest panel (top-right; collapsible) -->
  <div id="quest-panel"></div>

  <!-- Help / tutorial modal (sections gated by what's unlocked) -->
  <div id="help-modal" class="modal hidden">
    <div class="modal-box help-box">
      <div class="modal-head">
        <h2>❓ How to play</h2>
        <button id="help-close" class="close-btn">✕</button>
      </div>
      <div id="help-body"></div>
    </div>
  </div>

  <!-- Dragon story dialog (stage-ups) -->
  <div id="dragon-modal" class="modal hidden">
    <div class="modal-box dragon-box">
      <div class="dragon-ico">🐉</div>
      <p id="dragon-text"></p>
      <button id="dragon-continue" class="build-card">Continue ▶</button>
    </div>
  </div>

  <!-- Ascension Gate ending -->
  <div id="ascend-modal" class="modal hidden">
    <div class="modal-box ascend-box">
      <div class="dragon-ico">⛩️</div>
      <h2>The Ascension Gate stands complete</h2>
      <p>Talisman, star steel and dragon scale hum as one. The path beyond the
        grounds opens — step through, and begin again as something greater.</p>
      <p id="ascend-count"></p>
      <div class="ascend-row">
        <button id="ascend-go" class="build-card">☯ Ascend</button>
        <button id="ascend-later" class="build-card">Keep playing</button>
      </div>
    </div>
  </div>

  <!-- Win modal -->
  <div id="win-modal" class="modal hidden">
    <div class="modal-box win-box">
      <h1>🌍 The Worldstone is Forged!</h1>
      <div id="win-stats"></div>
      <button id="win-continue" class="build-card">Continue ▶</button>
    </div>
  </div>

  <script src="js/data.js?v=23"></script>
  <script src="js/state.js?v=23"></script>
  <script src="js/engine.js?v=23"></script>
  <script src="js/ui.js?v=23"></script>
  <script src="js/main.js?v=23"></script>
</body>
</html>
